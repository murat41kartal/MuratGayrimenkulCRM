<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murat Gayrimenkul CRM</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
.header { background: white; padding: 20px 30px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 22px; font-weight: 700; }
.header p { font-size: 13px; color: #888; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
.btn-primary { background: #2563eb; color: white; }
.btn-secondary { background: #f0f0f0; color: #333; margin-left: 8px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 20px 30px; }
.stat-card { background: white; border-radius: 10px; padding: 16px; border: 1px solid #e0e0e0; }
.stat-card .label { font-size: 12px; color: #888; }
.stat-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
.filters { padding: 0 30px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filter-btn { padding: 7px 16px; border-radius: 20px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 13px; }
.filter-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
.search { flex: 1; padding: 8px 14px; border: 1px solid #ddd; border-radius: 20px; font-size: 13px; min-width: 200px; }
.leads { padding: 0 30px 30px; }
.lead-card { background: white; border-radius: 10px; padding: 16px 20px; margin-bottom: 10px; border: 1px solid #e0e0e0; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: box-shadow 0.2s; }
.lead-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: #2563eb; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; }
.lead-info { flex: 1; }
.lead-name { font-weight: 600; font-size: 15px; }
.lead-sub { font-size: 12px; color: #888; margin-top: 3px; }
.badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.badge-yeni { background: #dbeafe; color: #1d4ed8; }
.badge-arandi { background: #dcfce7; color: #15803d; }
.badge-randevu { background: #fef9c3; color: #a16207; }
.badge-kapandi { background: #f3f4f6; color: #6b7280; }
.lead-date { font-size: 12px; color: #aaa; margin-left: 8px; }
.error { background: #fee2e2; color: #dc2626; padding: 12px 16px; border-radius: 8px; margin: 10px 30px; font-size: 13px; }
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal { background: white; border-radius: 14px; padding: 28px; width: 480px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 18px; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: #555; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
.form-group textarea { height: 80px; resize: vertical; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.loading { text-align: center; padding: 40px; color: #888; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Murat Gayrimenkul CRM</h1>
    <p>Lead yönetim paneli</p>
  </div>
  <div>
    <button class="btn btn-primary" onclick="openModal()">+ Yeni Lead</button>
    <button class="btn btn-secondary" onclick="loadLeads()">↻ Yenile</button>
  </div>
</div>

<div class="stats">
  <div class="stat-card"><div class="label">Toplam Lead</div><div class="value" id="total">0</div></div>
  <div class="stat-card"><div class="label">Yeni</div><div class="value" id="count-yeni">0</div></div>
  <div class="stat-card"><div class="label">Randevu</div><div class="value" id="count-randevu">0</div></div>
  <div class="stat-card"><div class="label">Kapandı</div><div class="value" id="count-kapandi">0</div></div>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="setFilter('tumu', this)">Tümü</button>
  <button class="filter-btn" onclick="setFilter('Yeni', this)">Yeni</button>
  <button class="filter-btn" onclick="setFilter('Arandı', this)">Arandı</button>
  <button class="filter-btn" onclick="setFilter('Randevu', this)">Randevu</button>
  <button class="filter-btn" onclick="setFilter('Kapandı', this)">Kapandı</button>
  <input class="search" type="text" placeholder="Telefon, isim veya ilçe ara..." oninput="searchLeads(this.value)">
</div>

<div id="error-msg"></div>
<div class="leads" id="leads-list"><div class="loading">Yükleniyor...</div></div>

<!-- Yeni Lead Modal -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h2>Yeni Lead Ekle</h2>
    <div id="modal-error"></div>
    <div class="form-group"><label>Ad Soyad</label><input id="f-ad" type="text"></div>
    <div class="form-group"><label>Telefon</label><input id="f-telefon" type="text"></div>
    <div class="form-group"><label>İlçe</label><input id="f-ilce" type="text"></div>
    <div class="form-group"><label>Mülk Tipi</label>
      <select id="f-mulk">
        <option>Konut</option><option>Arsa</option><option>Ticari</option><option>Plaza</option>
      </select>
    </div>
    <div class="form-group"><label>Not</label><textarea id="f-not"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">İptal</button>
      <button class="btn btn-primary" onclick="saveLead()">Kaydet</button>
    </div>
  </div>
</div>

<!-- Güncelle Modal -->
<div class="modal-bg" id="modal-edit">
  <div class="modal">
    <h2>Lead Güncelle</h2>
    <div id="edit-error"></div>
    <input type="hidden" id="e-id">
    <div class="form-group"><label>Ad Soyad</label><input id="e-ad" type="text" disabled style="background:#f5f5f5"></div>
    <div class="form-group"><label>Telefon</label><input id="e-telefon" type="text" disabled style="background:#f5f5f5"></div>
    <div class="form-group"><label>Durum</label>
      <select id="e-durum">
        <option>Yeni</option><option>Arandı</option><option>Randevu</option><option>Kapandı</option>
      </select>
    </div>
    <div class="form-group"><label>Not</label><textarea id="e-not"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeEditModal()">İptal</button>
      <button class="btn btn-primary" onclick="updateLead()">Güncelle</button>
    </div>
  </div>
</div>

<script>
const GET_URL = '/webhook/crm-get';
const POST_URL = '/webhook/crm-post';

let allLeads = [];
let currentFilter = 'tumu';

async function loadLeads() {
  try {
    const res = await fetch(GET_URL);
    const data = await res.json();
    allLeads = Array.isArray(data) ? data : [];
    document.getElementById('error-msg').innerHTML = '';
    updateStats();
    renderLeads();
  } catch(e) {
    document.getElementById('error-msg').innerHTML = '<div class="error">Veri yüklenemedi: ' + e.message + '</div>';
  }
}

function updateStats() {
  document.getElementById('total').textContent = allLeads.length;
  document.getElementById('count-yeni').textContent = allLeads.filter(l => l.durum === 'Yeni').length;
  document.getElementById('count-randevu').textContent = allLeads.filter(l => l.durum === 'Randevu').length;
  document.getElementById('count-kapandi').textContent = allLeads.filter(l => l.durum === 'Kapandı').length;
}

function renderLeads(leads) {
  const list = leads || getFiltered();
  const el = document.getElementById('leads-list');
  if (!list.length) { el.innerHTML = '<div class="loading">Lead bulunamadı.</div>'; return; }
  el.innerHTML = list.map(l => `
    <div class="lead-card" onclick="openEdit(${JSON.stringify(l).replace(/"/g,'&quot;')})">
      <div class="avatar">${(l.ad||'?')[0].toUpperCase()}</div>
      <div class="lead-info">
        <div class="lead-name">${l.ad || '-'}</div>
        <div class="lead-sub">${l.telefon || ''} · ${l.ilce || ''} · ${l.mulk_tipi || ''}</div>
      </div>
      <span class="badge badge-${(l.durum||'yeni').toLowerCase().replace('ı','i').replace('ı','i')}">${l.durum || 'Yeni'}</span>
      <span class="lead-date">${l.created_at ? new Date(l.created_at).toLocaleDateString('tr-TR') : ''}</span>
    </div>
  `).join('');
}

function getFiltered() {
  if (currentFilter === 'tumu') return allLeads;
  return allLeads.filter(l => l.durum === currentFilter);
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderLeads();
}

function searchLeads(q) {
  if (!q) { renderLeads(); return; }
  const r = allLeads.filter(l => 
    (l.ad||'').toLowerCase().includes(q.toLowerCase()) ||
    (l.telefon||'').includes(q) ||
    (l.ilce||'').toLowerCase().includes(q.toLowerCase())
  );
  renderLeads(r);
}

function openModal() {
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal-error').innerHTML = '';
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function saveLead() {
  const ad = document.getElementById('f-ad').value.trim();
  const telefon = document.getElementById('f-telefon').value.trim();
  if (!ad || !telefon) { document.getElementById('modal-error').innerHTML = '<div class="error">Ad ve telefon zorunlu.</div>'; return; }
  try {
    const res = await fetch(POST_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'ekle',
        ad, telefon,
        ilce: document.getElementById('f-ilce').value,
        mulk_tipi: document.getElementById('f-mulk').value,
        notlar: document.getElementById('f-not').value
      })
    });
    closeModal();
    loadLeads();
  } catch(e) {
    document.getElementById('modal-error').innerHTML = '<div class="error">Hata: ' + e.message + '</div>';
  }
}

function openEdit(lead) {
  document.getElementById('e-id').value = lead.id;
  document.getElementById('e-ad').value = lead.ad || '';
  document.getElementById('e-telefon').value = lead.telefon || '';
  document.getElementById('e-durum').value = lead.durum || 'Yeni';
  document.getElementById('e-not').value = lead.notlar || '';
  document.getElementById('modal-edit').classList.add('open');
}
function closeEditModal() { document.getElementById('modal-edit').classList.remove('open'); }

async function updateLead() {
  try {
    await fetch(POST_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'guncelle',
        id: document.getElementById('e-id').value,
        durum: document.getElementById('e-durum').value,
        notlar: document.getElementById('e-not').value
      })
    });
    closeEditModal();
    loadLeads();
  } catch(e) {
    document.getElementById('edit-error').innerHTML = '<div class="error">Hata: ' + e.message + '</div>';
  }
}

loadLeads();
</script>
</body>
</html>
