<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murat Gayrimenkul CRM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }
.crm-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
.crm-title { font-size: 20px; font-weight: 600; color: #1a1a1a; }
.crm-subtitle { font-size: 13px; color: #888; margin-top: 2px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.5rem; }
.stat { background: #fff; border-radius: 10px; padding: 14px 16px; border: 1px solid #e8e8e8; }
.stat-label { font-size: 12px; color: #888; margin-bottom: 4px; }
.stat-val { font-size: 24px; font-weight: 600; color: #1a1a1a; }
.filters { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
.filter-btn { font-size: 13px; padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd; background: #fff; color: #666; cursor: pointer; }
.filter-btn.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }
.search-box { flex: 1; min-width: 160px; font-size: 13px; padding: 6px 12px; border-radius: 20px; border: 1px solid #ddd; background: #fff; color: #1a1a1a; outline: none; }
.search-box:focus { border-color: #1a73e8; }
.lead-list { display: flex; flex-direction: column; gap: 8px; }
.lead-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
.lead-card:hover { border-color: #bbb; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.lead-card.expanded { border-color: #1a73e8; }
.lead-top { display: flex; align-items: center; gap: 12px; }
.lead-avatar { width: 40px; height: 40px; border-radius: 50%; background: #e8f0fe; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #1a73e8; flex-shrink: 0; }
.lead-info { flex: 1; min-width: 0; }
.lead-name { font-size: 14px; font-weight: 500; color: #1a1a1a; }
.lead-phone { font-size: 12px; color: #888; }
.lead-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.badge { font-size: 11px; padding: 3px 9px; border-radius: 10px; font-weight: 500; }
.badge-yeni { background: #e8f0fe; color: #1a73e8; }
.badge-arandi { background: #fef3e2; color: #f59c00; }
.badge-randevu { background: #e6f4ea; color: #1e8e3e; }
.badge-kapandi { background: #f1f3f4; color: #666; }
.badge-ilce { background: #f1f3f4; color: #555; }
.tarih-text { font-size: 11px; color: #aaa; }
.lead-detail { margin-top: 14px; padding-top: 14px; border-top: 1px solid #f0f0f0; display: none; }
.lead-card.expanded .lead-detail { display: block; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.detail-item { font-size: 13px; }
.detail-label { color: #888; font-size: 11px; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
.detail-val { color: #1a1a1a; }
.durum-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.durum-select { font-size: 13px; padding: 5px 10px; border-radius: 8px; border: 1px solid #ddd; background: #f8f8f8; color: #1a1a1a; cursor: pointer; outline: none; }
.ai-box { background: #f8f9fa; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #555; line-height: 1.6; max-height: 100px; overflow-y: auto; margin-bottom: 12px; }
.ai-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.not-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.not-input { width: 100%; font-size: 13px; padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #1a1a1a; resize: none; outline: none; font-family: inherit; }
.save-btn { margin-top: 8px; font-size: 13px; padding: 7px 18px; border-radius: 8px; border: 1px solid #ddd; background: #f8f8f8; color: #1a1a1a; cursor: pointer; font-family: inherit; }
.save-btn:hover { background: #e8f0fe; border-color: #1a73e8; color: #1a73e8; }
.loading { text-align: center; padding: 3rem; color: #888; font-size: 14px; }
.error-box { background: #fce8e6; border-radius: 10px; padding: 12px 16px; color: #d93025; font-size: 13px; margin-bottom: 1rem; }
.empty { text-align: center; padding: 3rem; color: #888; font-size: 14px; }
.refresh-btn { font-size: 13px; padding: 7px 14px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #555; cursor: pointer; }
.refresh-btn:hover { background: #f8f8f8; }
.chevron { font-size: 12px; color: #aaa; margin-left: auto; transition: transform 0.2s; }
.lead-card.expanded .chevron { transform: rotate(180deg); }
@media (max-width: 600px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .detail-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
  <div class="crm-header">
    <div>
      <div class="crm-title">Murat Gayrimenkul CRM</div>
      <div class="crm-subtitle">Lead yönetim paneli</div>
    </div>
    <button class="refresh-btn" onclick="loadLeads()">&#8635; Yenile</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-label">Toplam Lead</div><div class="stat-val" id="s-toplam">—</div></div>
    <div class="stat"><div class="stat-label">Yeni</div><div class="stat-val" id="s-yeni">—</div></div>
    <div class="stat"><div class="stat-label">Randevu</div><div class="stat-val" id="s-randevu">—</div></div>
    <div class="stat"><div class="stat-label">Kapandı</div><div class="stat-val" id="s-kapandi">—</div></div>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('tumu', this)">Tümü</button>
    <button class="filter-btn" onclick="setFilter('Yeni', this)">Yeni</button>
    <button class="filter-btn" onclick="setFilter('Arandı', this)">Arandı</button>
    <button class="filter-btn" onclick="setFilter('Randevu', this)">Randevu</button>
    <button class="filter-btn" onclick="setFilter('Kapandı', this)">Kapandı</button>
    <input class="search-box" type="text" placeholder="Telefon, isim veya ilçe ara..." oninput="setSearch(this.value)" />
  </div>
  <div id="error-area"></div>
  <div class="lead-list" id="lead-list"><div class="loading">Yükleniyor...</div></div>
</div>
<script>
const SUPA_URL = 'https://lxmgsvtjwufeyfaelvor.supabase.co';
const SUPA_KEY = 'sb_publishable_ZyQ859AZQtIs1veghKMuVw_W9Cv_GB3';
let allLeads = [], activeFilter = 'tumu', searchVal = '', expandedId = null;

async function loadLeads() {
  document.getElementById('lead-list').innerHTML = '<div class="loading">Yükleniyor...</div>';
  document.getElementById('error-area').innerHTML = '';
  try {
    const res = await fetch(SUPA_URL + '/rest/v1/leads?select=*&order=created_at.desc', {
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
    });
    if (!res.ok) throw new Error('Hata ' + res.status);
    allLeads = await res.json();
    updateStats(); renderLeads();
  } catch(e) {
    document.getElementById('error-area').innerHTML = '<div class="error-box">Veri yüklenemedi: ' + e.message + '</div>';
    document.getElementById('lead-list').innerHTML = '';
  }
}

function updateStats() {
  document.getElementById('s-toplam').textContent = allLeads.length;
  document.getElementById('s-yeni').textContent = allLeads.filter(l => (l.durum||'Yeni') === 'Yeni').length;
  document.getElementById('s-randevu').textContent = allLeads.filter(l => l.durum === 'Randevu').length;
  document.getElementById('s-kapandi').textContent = allLeads.filter(l => l.durum === 'Kapandı').length;
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); renderLeads();
}
function setSearch(v) { searchVal = v.toLowerCase(); renderLeads(); }
function badgeClass(d) {
  if (d==='Yeni') return 'badge-yeni';
  if (d==='Arandı') return 'badge-arandi';
  if (d==='Randevu') return 'badge-randevu';
  return 'badge-kapandi';
}
function initials(name, phone) {
  if (name && name !== 'bilinmiyor' && name !== 'HÜKÜMSÜZ' && name.trim().length > 0) {
    const p = name.trim().split(' ');
    return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();
  }
  return (phone || '??').slice(-2);
}
function fmtDate(d) {
  if (!d) return '';
  try { return new Date(d).toLocaleString('tr-TR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e) { return d; }
}
function renderLeads() {
  let filtered = allLeads.filter(l => {
    if (activeFilter !== 'tumu' && (l.durum||'Yeni') !== activeFilter) return false;
    if (searchVal) { const h = ((l.telefon||'')+(l.ilce||'')+(l.mahalle||'')+(l.ad_soyad||'')+(l.mesaj||'')).toLowerCase(); if (!h.includes(searchVal)) return false; }
    return true;
  });
  const el = document.getElementById('lead-list');
  if (!filtered.length) { el.innerHTML = '<div class="empty">Lead bulunamadı.</div>'; return; }
  el.innerHTML = filtered.map(l => {
    const isExp = expandedId === l.id;
    const d = l.durum || 'Yeni';
    const ini = initials(l.ad_soyad, l.telefon);
    const phone = (l.telefon && l.telefon !== 'HÜKÜMSÜZ') ? l.telefon : '—';
    const name = (l.ad_soyad && l.ad_soyad !== 'bilinmiyor' && l.ad_soyad !== 'HÜKÜMSÜZ') ? l.ad_soyad : 'Bilinmiyor';
    return '<div class="lead-card'+(isExp?' expanded':'')+'" onclick="toggleExpand('+l.id+')">'+
      '<div class="lead-top">'+
        '<div class="lead-avatar">'+ini+'</div>'+
        '<div class="lead-info"><div class="lead-name">'+name+'</div><div class="lead-phone">'+phone+'</div></div>'+
        '<div class="lead-meta">'+
          '<span class="badge '+badgeClass(d)+'">'+d+'</span>'+
          (l.ilce&&l.ilce!=='bilinmiyor'?'<span class="badge badge-ilce">'+l.ilce+'</span>':'')+
          '<span class="tarih-text">'+fmtDate(l.created_at)+'</span>'+
        '</div>'+
        '<span class="chevron">&#9660;</span>'+
      '</div>'+
      '<div class="lead-detail">'+
        '<div class="detail-grid">'+
          '<div class="detail-item"><div class="detail-label">Mesaj</div><div class="detail-val">'+(l.mesaj||'—')+'</div></div>'+
          '<div class="detail-item"><div class="detail-label">Amaç</div><div class="detail-val">'+(l.amac||'—')+'</div></div>'+
          '<div class="detail-item"><div class="detail-label">İlçe</div><div class="detail-val">'+(l.ilce||'—')+'</div></div>'+
          '<div class="detail-item"><div class="detail-label">Mahalle</div><div class="detail-val">'+(l.mahalle||'—')+'</div></div>'+
        '</div>'+
        '<div class="durum-row"><span style="font-size:13px;color:#888;">Durum:</span>'+
          '<select class="durum-select" onchange="updateDurum('+l.id+',this.value)" onclick="event.stopPropagation()">'+
            ['Yeni','Arandı','Randevu','Kapandı'].map(o=>'<option'+(d===o?' selected':'')+'>'+o+'</option>').join('')+
          '</select></div>'+
        (l.ai_yaniti?'<div class="ai-label">AI Yanıtı</div><div class="ai-box">'+l.ai_yaniti+'</div>':'')+
        '<div class="not-label">Not</div>'+
        '<textarea class="not-input" id="not-'+l.id+'" rows="2" placeholder="Not ekle..." onclick="event.stopPropagation()">'+(l.not_alani||'')+'</textarea>'+
        '<button class="save-btn" onclick="saveNot('+l.id+');event.stopPropagation()">&#128190; Kaydet</button>'+
      '</div></div>';
  }).join('');
}
function toggleExpand(id) { expandedId = expandedId===id ? null : id; renderLeads(); }
async function updateDurum(id, durum) {
  try {
    await fetch(SUPA_URL+'/rest/v1/leads?id=eq.'+id, {
      method:'PATCH', headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body: JSON.stringify({durum})
    });
    const l = allLeads.find(l=>l.id===id); if(l) l.durum=durum;
    updateStats(); renderLeads();
  } catch(e) { alert('Durum güncellenemedi'); }
}
async function saveNot(id) {
  const not_alani = (document.getElementById('not-'+id)||{}).value||'';
  try {
    await fetch(SUPA_URL+'/rest/v1/leads?id=eq.'+id, {
      method:'PATCH', headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body: JSON.stringify({not_alani})
    });
    const l = allLeads.find(l=>l.id===id); if(l) l.not_alani=not_alani;
    alert('Not kaydedildi!');
  } catch(e) { alert('Not kaydedilemedi'); }
}
loadLeads();
</script>
</body>
</html>
