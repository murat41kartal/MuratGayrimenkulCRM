<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0e; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-box { background: #1a1a18; border: 1px solid #2a2a28; border-radius: 16px; padding: 2.5rem 2rem; width: 100%; max-width: 360px; text-align: center; }
.logo { font-size: 32px; margin-bottom: 1rem; }
.title { font-size: 18px; font-weight: 600; color: #f0ede8; margin-bottom: 4px; }
.subtitle { font-size: 13px; color: #888; margin-bottom: 2rem; }
.field { margin-bottom: 1rem; text-align: left; }
.field label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; display: block; margin-bottom: 6px; }
.field input { width: 100%; padding: 12px 14px; background: #0f0f0e; border: 1.5px solid #2a2a28; border-radius: 8px; color: #f0ede8; font-size: 15px; outline: none; font-family: inherit; transition: border-color 0.2s; }
.field input:focus { border-color: #c9a84c; }
.btn { width: 100%; padding: 13px; background: #c9a84c; border: none; border-radius: 8px; color: #0f0f0e; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity 0.2s; margin-top: 0.5rem; }
.btn:hover { opacity: 0.88; }
.error { color: #e05c5c; font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">🏠</div>
  <div class="title">Murat Gayrimenkul</div>
  <div class="subtitle">Lütfen giriş yapın</div>
  <div class="field">
    <label>Şifre</label>
    <input type="password" id="sifre" placeholder="••••••••••••" onkeydown="if(event.key==='Enter') giris()">
  </div>
  <button class="btn" onclick="giris()">Giriş Yap</button>
  <div class="error" id="hata">❌ Hatalı şifre! Tekrar deneyin.</div>
</div>
<script>
var HEDEF = 'murat-gayrimenkul-crm-secured.html';
function giris() {
  var s = document.getElementById('sifre').value;
  var encoded = '';
  try { encoded = btoa(s); } catch(e) { encoded = btoa(unescape(encodeURIComponent(s))); }
  if (encoded === 'TXVyYXQxOTgwMTk4MCo=') {
    sessionStorage.setItem('mgcrm_auth', 'OK');
    window.location.href = HEDEF;
  } else {
    document.getElementById('hata').style.display = 'block';
    document.getElementById('sifre').value = '';
    document.getElementById('sifre').focus();
  }
}
// Zaten giriş yapıldıysa direkt yönlendir
if (sessionStorage.getItem('mgcrm_auth') === 'OK') {
  window.location.href = HEDEF;
}
</script>
</body>
</html>
