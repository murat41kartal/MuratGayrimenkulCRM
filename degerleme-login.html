<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş — Murat Gayrimenkul CRM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0e; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.box { background: #1a1a18; border: 1px solid #2a2a28; border-radius: 16px; padding: 2.5rem 2rem; width: 100%; max-width: 360px; text-align: center; }
.logo { font-size: 32px; margin-bottom: 1rem; }
.title { font-size: 18px; font-weight: 600; color: #f0ede8; margin-bottom: 4px; }
.sub { font-size: 13px; color: #888; margin-bottom: 2rem; }
label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; display: block; margin-bottom: 6px; text-align: left; }
input { width: 100%; padding: 12px 14px; background: #0f0f0e; border: 1.5px solid #2a2a28; border-radius: 8px; color: #f0ede8; font-size: 15px; outline: none; margin-bottom: 1rem; }
input:focus { border-color: #c9a84c; }
button { width: 100%; padding: 13px; background: #c9a84c; border: none; border-radius: 8px; color: #0f0f0e; font-size: 15px; font-weight: 600; cursor: pointer; }
button:hover { opacity: 0.88; }
.err { color: #e05c5c; font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">🏠</div>
  <div class="title">Murat Gayrimenkul</div>
  <div class="sub">Emlak Değerleme — Lütfen giriş yapın</div>
  <label>Şifre</label>
  <input type="password" id="s" placeholder="••••••••••" onkeydown="if(event.key==='Enter')giris()">
  <button onclick="giris()">Giriş Yap</button>
  <div class="err" id="e">❌ Hatalı şifre!</div>
</div>
<script>
function giris() {
  var v = document.getElementById('s').value;
  var ok = false;
  try { ok = (btoa(v) === 'TXVyYXQxOTgwMTk4MCo='); } catch(ex) { ok = false; }
  if (ok) {
    window.location.href = 'emlak-degerleme-secured.html?auth=TXVyYXQxOTgwMTk4MCo=';
  } else {
    document.getElementById('e').style.display = 'block';
    document.getElementById('s').value = '';
    document.getElementById('s').focus();
  }
}
</script>
</body>
</html>
